name: artifact

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Remove invisible Unicode characters
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(".github/forge.js")
          s = p.read_text(encoding="utf-8")
          for ch in ("\u200b", "\ufeff", "\u2060"):
              s = s.replace(ch, "")
          p.write_text(s, encoding="utf-8")
          print("Invisible characters removed")
          PY

      - uses: ./
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ART_NAME: rc